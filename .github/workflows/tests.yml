name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Verify CLI entrypoint
        run: |
          cerebro --version
          cerebro samples --quiet --report - | head -5

  skill-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install validator dependency
        run: python -m pip install 'PyYAML>=6.0'
      - name: Validate SKILL.md frontmatter
        run: |
          mapfile -t skill_files < <(find . -name SKILL.md -not -path './.git/*' -print)
          python scripts/validate_skill.py "${skill_files[@]}"
