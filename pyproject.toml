[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebro-skill"
dynamic = ["version"]
description = "Strategic intelligence engine for markdown vaults — scan, score, and connect knowledge across Obsidian and plain-markdown knowledge bases."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "J'Juan Wilson Jr.", email = "hello@microhustlestack.com" }]
keywords = ["obsidian", "markdown", "knowledge-management", "intelligence", "vault", "pkm", "ai-agent", "claude-skill"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
cerebro = "cerebro.cli:main"

[project.urls]
Homepage = "https://github.com/microhustlestack/cerebro"
Issues = "https://github.com/microhustlestack/cerebro/issues"
Changelog = "https://github.com/microhustlestack/cerebro/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "cerebro.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
